# cargo-deny config — the "analyze" gate (supply-chain + licenses + sources).
# This is the Rust equivalent of the C pipeline's cppcheck/MISRA stage: instead
# of C lint rules, we audit dependencies for known CVEs, disallowed licenses, and
# untrusted sources. Run by `cargo deny check` in CI.
# Docs: https://embarkstudios.github.io/cargo-deny/

# ── Security advisories (RustSec) ────────────────────────────────────────────
[advisories]
# Fail on any crate with a known vulnerability or that is unmaintained/yanked.
version = 2
yanked = "deny"
# If a specific advisory must be temporarily accepted, add its RUSTSEC id here
# with a justification comment (audit trail — IEC 62304 deviation record).
ignore = []

# ── License policy ───────────────────────────────────────────────────────────
# Embedded Rust crates are overwhelmingly MIT/Apache-2.0. Allow the permissive
# set; anything else (GPL, AGPL, unknown) fails the gate and must be reviewed.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
# Crates with a missing/ambiguous license expression fail unless listed here.
confidence-threshold = 0.9

# ── Banned crates / duplicates ───────────────────────────────────────────────
[bans]
# Warn on multiple versions of the same crate (bloat / audit surface). Not a hard
# fail — embedded dep trees often legitimately pull two semver-major versions.
multiple-versions = "warn"
wildcard = "deny"     # no `*` version requirements (reproducibility)

# ── Allowed dependency sources ───────────────────────────────────────────────
[sources]
unknown-registry = "deny"   # only crates.io (no random registries)
unknown-git = "deny"        # no un-pinned git deps
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
