[package]
name = "f429zi-logic"
version = "0.1.0"
edition = "2024"
authors = ["Evil52"]

# Pure logic: no Embassy, no hardware. Builds no_std for the embedded target and
# std for the host (so `cargo test` runs the unit tests natively on the Mac).
[dependencies]
heapless = "0.9"

# sqrtf for the PT100 math (rtd.rs). Needed ONLY on the bare-metal target — core
# has no f32::sqrt there. On the host the test build uses f32::sqrt (std), so we
# gate libm on target_os = "none" to keep host tests dependency-light.
[target.'cfg(target_os = "none")'.dependencies]
libm = "0.2"

[dev-dependencies]
assert_matches = "1"
